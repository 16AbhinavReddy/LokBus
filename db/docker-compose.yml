services:
  postgres:
    image: postgres:16
    container_name: lokbus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: lokbus
      POSTGRES_USER: lokbus
      POSTGRES_PASSWORD: lokbus_dev
    ports:
      - "5432:5432"
    volumes:
      - lokbus-postgres-data:/var/lib/postgresql/data
      - ./01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./02_staging.sql:/docker-entrypoint-initdb.d/02_staging.sql:ro

volumes:
  lokbus-postgres-data:
